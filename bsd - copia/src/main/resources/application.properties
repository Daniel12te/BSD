# Nombre de la aplicación
spring.application.name=bsd

# Configuración Base de Datos H2
spring.datasource.url=jdbc:h2:mem:bsddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Para ver la consola de la BD en http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Mostrar las consultas SQL en la consola (útil para aprender)
spring.jpa.show-sql=true

# Permitir subir archivos grandes
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB